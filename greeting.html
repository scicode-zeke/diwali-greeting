<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>शुभ दीपावली</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap">
<style>
/* Layout: one centred greeting on a night sky. A slow mandala sits behind the lines, a row of lit diyas closes the page, and sparks drift over everything. Deliberately a single dark look. */
:root {
  --night: #150a30;
  --dusk: #2b1260;
  --horizon: #7a1f3d;
  --gold: #f6c453;
  --marigold: #ff8a1f;
  --chili: #e8453c;
  --paper: #fff3dc;
  --muted: #cdbdd0;
  --display: "Yatra One", "Tiro Devanagari Hindi", Georgia, "Times New Roman", serif;
  --body: "Hind", "Noto Sans", system-ui, sans-serif;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
body {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(130% 55% at 50% 108%, var(--horizon) 0%, rgba(122, 31, 61, 0) 62%),
    radial-gradient(90% 45% at 50% -5%, var(--dusk) 0%, rgba(43, 18, 96, 0) 70%),
    linear-gradient(180deg, #150a30 0%, #1b0b36 60%, #240d3a 100%);
  background-color: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}

.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.3px 1.3px at 8% 12%, #fff, transparent),
    radial-gradient(1px 1px at 22% 30%, #ffe9a8, transparent),
    radial-gradient(1.4px 1.4px at 37% 8%, #fff, transparent),
    radial-gradient(1px 1px at 52% 22%, #ffe9a8, transparent),
    radial-gradient(1.3px 1.3px at 66% 10%, #fff, transparent),
    radial-gradient(1px 1px at 79% 27%, #ffe9a8, transparent),
    radial-gradient(1.4px 1.4px at 91% 14%, #fff, transparent),
    radial-gradient(1px 1px at 14% 55%, #ffe9a8, transparent),
    radial-gradient(1.2px 1.2px at 88% 52%, #fff, transparent),
    radial-gradient(1px 1px at 5% 78%, #ffe9a8, transparent),
    radial-gradient(1.2px 1.2px at 95% 80%, #fff, transparent);
  animation: twinkle 5s ease-in-out infinite alternate;
}

#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.page {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: clip;
  padding-block: 32px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.hero {
  position: relative;
  width: 100%;
  max-width: 680px;
  padding-block: clamp(36px, 8vh, 88px);
  display: flex;
  justify-content: center;
}

.mandala {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(125%, 600px);
  aspect-ratio: 1;
  max-width: 100%;
  transform: translate(-50%, -50%);
  opacity: 0.42;
  pointer-events: none;
}
.mandala svg { display: block; width: 100%; height: 100%; animation: spin 160s linear infinite; }
.mandala svg * { fill: none; stroke: var(--gold); stroke-width: 0.6; }
.mandala svg .dot { fill: var(--gold); stroke: none; }

.greet {
  position: relative;
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.75rem, 7.8vw, 4rem);
  line-height: 1.4;
  text-align: center;
  text-wrap: balance;
  text-shadow: 0 2px 26px rgba(21, 10, 48, 0.95), 0 0 2px rgba(21, 10, 48, 0.8);
}
.greet span { display: block; }
.greet .shubh {
  margin-top: 0.05em;
  padding-block: 0.12em;
  font-size: 1.12em;
  color: var(--gold);
  background: linear-gradient(180deg, #ffe9a8 8%, #f6c453 48%, #ff8a1f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 16px rgba(255, 138, 31, 0.5));
}

.orn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: min(320px, 72%);
  margin: 4px 0 22px;
}
.orn i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.orn i:last-child { background: linear-gradient(270deg, transparent, var(--gold)); }
.orn b { width: 10px; height: 10px; transform: rotate(45deg); background: var(--marigold); box-shadow: 0 0 14px var(--marigold); }

.blessing {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(2rem, 9vw, 3.4rem);
  line-height: 1.4;
  color: var(--marigold);
  text-shadow: 0 0 22px rgba(255, 138, 31, 0.55);
  text-align: center;
}

.diyas {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: clamp(6px, 2vw, 18px);
  margin-top: clamp(64px, 11vh, 96px);
}
.diya { position: relative; width: clamp(48px, 14vw, 88px); }
.diya.big { width: clamp(64px, 19vw, 120px); }
.diya svg.bowl { display: block; width: 100%; aspect-ratio: 120 / 64; position: relative; z-index: 1; }
.diya::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 100%;
  width: 230%;
  aspect-ratio: 1;
  transform: translate(-50%, 50%);
  background: radial-gradient(circle closest-side, rgba(255, 176, 60, 0.5), rgba(255, 120, 40, 0.14) 55%, rgba(255, 120, 40, 0));
  animation: pulse 2.6s ease-in-out infinite alternate;
  pointer-events: none;
}
.diya svg.flame {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 80%;
  width: 17%;
  margin-left: -8.5%;
  aspect-ratio: 20 / 32;
  transform-origin: 50% 100%;
  animation: flick 1.5s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 6px rgba(255, 170, 50, 0.9));
}
.diya:nth-child(2) svg.flame, .diya:nth-child(2)::before { animation-delay: -0.4s; }
.diya:nth-child(3) svg.flame, .diya:nth-child(3)::before { animation-delay: -0.9s; }
.diya:nth-child(4) svg.flame, .diya:nth-child(4)::before { animation-delay: -0.2s; }
.diya:nth-child(5) svg.flame, .diya:nth-child(5)::before { animation-delay: -1.1s; }

.hint {
  margin: 22px 0 0;
  font-size: 0.95rem;
  color: var(--muted);
  text-align: center;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { from { opacity: 0.45; } to { opacity: 0.95; } }
@keyframes pulse {
  from { opacity: 0.72; transform: translate(-50%, 50%) scale(0.94); }
  to { opacity: 1; transform: translate(-50%, 50%) scale(1.06); }
}
@keyframes flick {
  0% { transform: scale(1, 1) skewX(0deg); }
  25% { transform: scale(0.93, 1.08) skewX(-3deg); }
  50% { transform: scale(1.05, 0.95) skewX(2deg); }
  75% { transform: scale(0.96, 1.05) skewX(-1.5deg); }
  100% { transform: scale(1, 1) skewX(1.5deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; }
}
</style>

<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#e0662a"/>
      <stop offset="1" stop-color="#8f2a14"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.55" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ffe98a"/>
    </linearGradient>
    <symbol id="bowl" viewBox="0 0 120 64">
      <path d="M5 16 C8 46 32 60 60 60 C88 60 112 46 115 16 Z" fill="url(#clay)"/>
      <ellipse cx="60" cy="16" rx="55" ry="6.5" fill="#ffc15e"/>
      <ellipse cx="60" cy="16.8" rx="47" ry="4.2" fill="#3a1208"/>
      <rect x="58" y="8" width="4" height="10" rx="2" fill="#2a1008"/>
      <path d="M16 30 C40 41 80 41 104 30" fill="none" stroke="#ffd98a" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="30" cy="40" r="2" fill="#ffd98a"/>
      <circle cx="45" cy="45" r="2" fill="#ffd98a"/>
      <circle cx="60" cy="46.5" r="2" fill="#ffd98a"/>
      <circle cx="75" cy="45" r="2" fill="#ffd98a"/>
      <circle cx="90" cy="40" r="2" fill="#ffd98a"/>
    </symbol>
    <symbol id="flame" viewBox="0 0 20 32">
      <path d="M10 1 C12 9 19 14 19 22 A9 9 0 0 1 1 22 C1 14 8 10 10 1Z" fill="url(#fl)"/>
      <path d="M10 12 C11.5 16 14.5 18 14.5 22.5 A4.5 4.5 0 0 1 5.5 22.5 C5.5 18 8.5 16 10 12Z" fill="#fff7c9" opacity="0.92"/>
    </symbol>
  </defs>
</svg>

<div class="stars" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="page" lang="hi">
  <section class="hero">
    <div class="mandala" aria-hidden="true"><svg viewBox="-100 -100 200 200"><g id="m"></g></svg></div>
    <h1 class="greet">
      <span>आपको और आपके</span>
      <span>पूरे परिवार को</span>
      <span class="shubh">शुभ दीपावली</span>
    </h1>
  </section>

  <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
  <p class="blessing">तथास्तु</p>

  <div class="diyas" aria-hidden="true">
    <div class="diya"><svg class="flame" viewBox="0 0 20 32"><use href="#flame"/></svg><svg class="bowl" viewBox="0 0 120 64"><use href="#bowl"/></svg></div>
    <div class="diya"><svg class="flame" viewBox="0 0 20 32"><use href="#flame"/></svg><svg class="bowl" viewBox="0 0 120 64"><use href="#bowl"/></svg></div>
    <div class="diya big"><svg class="flame" viewBox="0 0 20 32"><use href="#flame"/></svg><svg class="bowl" viewBox="0 0 120 64"><use href="#bowl"/></svg></div>
    <div class="diya"><svg class="flame" viewBox="0 0 20 32"><use href="#flame"/></svg><svg class="bowl" viewBox="0 0 120 64"><use href="#bowl"/></svg></div>
    <div class="diya"><svg class="flame" viewBox="0 0 20 32"><use href="#flame"/></svg><svg class="bowl" viewBox="0 0 120 64"><use href="#bowl"/></svg></div>
  </div>

  <p class="hint">आसमान जगमगाने के लिए कहीं भी छूएँ</p>
</main>

<script>
(function () {
  // Mandala ring behind the greeting
  var NS = 'http://www.w3.org/2000/svg';
  var g = document.getElementById('m');
  function add(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    g.appendChild(e);
  }
  add('circle', { r: 97 });
  add('circle', { r: 93, 'stroke-dasharray': '1 3' });
  for (var i = 0; i < 16; i++) {
    add('path', { d: 'M0 -90 C9 -76 9 -64 0 -54 C-9 -64 -9 -76 0 -90Z', transform: 'rotate(' + (i * 22.5) + ')' });
    add('path', { d: 'M0 -72 C6 -64 6 -56 0 -48 C-6 -56 -6 -64 0 -72Z', transform: 'rotate(' + (i * 22.5 + 11.25) + ')' });
  }
  add('circle', { r: 42 });
  for (var j = 0; j < 12; j++) {
    add('circle', { cy: -46, r: 1.3, class: 'dot', transform: 'rotate(' + (j * 30) + ')' });
  }
  for (var n = 0; n < 8; n++) {
    add('path', { d: 'M0 -36 C6 -28 6 -20 0 -13 C-6 -20 -6 -28 0 -36Z', transform: 'rotate(' + (n * 45) + ')' });
  }

  // Sparks and fireworks
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var COLORS = ['#ffd34d', '#ff8a1f', '#ff5a5f', '#ffe9a8', '#f6c453', '#ff9ecb'];
  var parts = [], embers = [];
  function pick() { return COLORS[(Math.random() * COLORS.length) | 0]; }

  function burst(x, y) {
    if (parts.length > 600) return;
    var count = 44 + ((Math.random() * 22) | 0);
    var c1 = pick(), c2 = pick();
    for (var i = 0; i < count; i++) {
      var a = (i / count) * Math.PI * 2 + Math.random() * 0.12;
      var s = 1.1 + Math.random() * 2.6;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: 0.008 + Math.random() * 0.01,
        color: i % 2 ? c1 : c2, size: 1.4 + Math.random() * 1.4
      });
    }
  }
  function ember() {
    embers.push({
      x: Math.random() * W, y: H + 8,
      vx: (Math.random() - 0.5) * 0.3, vy: -(0.35 + Math.random() * 0.8),
      r: 0.8 + Math.random() * 1.8, a: 0.3 + Math.random() * 0.6, ph: Math.random() * 6.28
    });
  }

  var nextBurst = 500;
  var running = true;
  function frame(t) {
    if (!running) return;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    if (t > nextBurst) {
      burst(W * (0.15 + Math.random() * 0.7), H * (0.1 + Math.random() * 0.35));
      nextBurst = t + 1600 + Math.random() * 1800;
    }
    if (embers.length < 60 && Math.random() < 0.35) ember();

    for (var i = embers.length - 1; i >= 0; i--) {
      var e = embers[i];
      e.x += e.vx + Math.sin(t / 700 + e.ph) * 0.25;
      e.y += e.vy;
      if (e.y < -10) { embers.splice(i, 1); continue; }
      ctx.globalAlpha = e.a * (0.6 + 0.4 * Math.sin(t / 250 + e.ph));
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.2832); ctx.fill();
    }
    for (var k = parts.length - 1; k >= 0; k--) {
      var p = parts[k];
      p.vy += 0.03; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(k, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + p.life * 0.5), 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { running = false; }
    else if (!running) { running = true; requestAnimationFrame(frame); }
  });
  window.addEventListener('pointerdown', function (ev) { burst(ev.clientX, ev.clientY); });
})();
</script>

</body></html>
